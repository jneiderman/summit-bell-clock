<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summit Bell Clock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap">
<style>
  :root {
    --bg: #101820;
    --panel: #18232e;
    --ink: #f4f6f8;
    --muted: #9fb0bf;
    --accent: #f5b400;
    --line: #2a3945;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Barlow", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  #app {
    box-sizing: border-box;
    height: 100%;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 4vw;
    padding: 4vh 5vw;
  }
  .eyebrow {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 500;
    font-size: 8vh;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    line-height: 1;
  }
  .period {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 34vh;
    line-height: 0.95;
    margin-top: 1.5vh;
    white-space: nowrap;
    letter-spacing: -0.01em;
  }
  .period.small { font-size: 22vh; line-height: 1.05; }
  .period .team { color: var(--muted); font-weight: 500; font-size: 0.55em; margin-right: 0.25em; }
  .side {
    text-align: right;
    font-variant-numeric: tabular-nums;
    border-left: 2px solid var(--line);
    padding-left: 4vw;
  }
  .range {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 500;
    font-size: 11vh;
    line-height: 1;
    white-space: nowrap;
  }
  .left {
    font-size: 9vh;
    font-weight: 600;
    line-height: 1.2;
    margin-top: 2vh;
    white-space: nowrap;
  }
  .left b { color: var(--accent); }
  .next {
    color: var(--muted);
    font-size: 7.5vh;
    line-height: 1.2;
    margin-top: 1vh;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div id="app">
  <div>
    <div class="eyebrow" id="eyebrow">Now</div>
    <div class="period" id="period">Loading</div>
  </div>
  <div class="side">
    <div class="range" id="range"></div>
    <div class="left" id="left"></div>
    <div class="next" id="next"></div>
  </div>
</div>

<script>
  // Summit School bell schedule. Times are minutes after midnight, America/New_York.
  const T = (h, m) => h * 60 + m;
  const SCHEDULE = [
    { s: T(8,35),  e: T(8,47),  name: "Homeroom" },
    { s: T(8,50),  e: T(9,37),  name: "Period 1" },
    { s: T(9,40),  e: T(10,27), name: "Period 2" },
    { s: T(10,30), e: T(11,17), name: "Period 3" },
    { s: T(11,20), e: T(12,7),  name: "Period 4" },
    { s: T(12,10), e: T(12,12), name: "Homeroom" },
    { s: T(12,12), e: T(12,42), name: "Lunch / Recess", split: [["9/10", "Lunch"], ["11/12", "Recess"]] },
    { s: T(12,42), e: T(13,12), name: "Recess / Lunch", split: [["9/10", "Recess"], ["11/12", "Lunch"]] },
    { s: T(13,12), e: T(13,14), name: "Homeroom" },
    { s: T(13,17), e: T(14,4),  name: "Period 6" },
    { s: T(14,7),  e: T(14,54), name: "Period 7" },
    { s: T(14,57), e: T(15,0),  name: "Homeroom" },
  ];

  const fmt = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York", hour: "numeric", minute: "2-digit",
    weekday: "short", hour12: false
  });

  function nyNow() {
    const parts = Object.fromEntries(fmt.formatToParts(new Date()).map(p => [p.type, p.value]));
    const h = parseInt(parts.hour, 10) % 24;
    return { min: h * 60 + parseInt(parts.minute, 10), weekday: parts.weekday };
  }

  function clock(m) {
    const h24 = Math.floor(m / 60), mm = m % 60;
    const h = h24 % 12 || 12;
    const ap = h24 < 12 ? "AM" : "PM";
    return h + ":" + String(mm).padStart(2, "0") + " " + ap;
  }

  function mins(n) { return n + (n === 1 ? " min" : " min"); }

  function render() {
    const { min, weekday } = nyNow();
    const el = id => document.getElementById(id);
    const periodEl = el("period");
    periodEl.classList.remove("small");

    if (weekday === "Sat" || weekday === "Sun") {
      el("eyebrow").textContent = weekday === "Sat" ? "Saturday" : "Sunday";
      periodEl.textContent = "No School";
      el("range").textContent = ""; el("left").textContent = ""; el("next").textContent = "";
      return;
    }

    const cur = SCHEDULE.find(p => min >= p.s && min < p.e);
    const next = SCHEDULE.find(p => p.s > min);

    if (cur) {
      el("eyebrow").textContent = "Now";
      if (cur.split) {
        periodEl.classList.add("small");
        periodEl.innerHTML = cur.split.map(([team, what]) =>
          `<div><span class="team">${team}</span>${what}</div>`).join("");
      } else {
        periodEl.textContent = cur.name;
      }
      el("range").textContent = clock(cur.s) + " – " + clock(cur.e);
      const rem = cur.e - min;
      el("left").innerHTML = `Ends in <b>${mins(rem)}</b>`;
      el("next").textContent = next ? "Next: " + next.name + " at " + clock(next.s) : "Last block of the day";
      return;
    }

    if (!next) {
      el("eyebrow").textContent = "Dismissal";
      periodEl.textContent = "School Day Over";
      el("range").textContent = ""; el("left").textContent = ""; el("next").textContent = "See you tomorrow";
      return;
    }

    const before = min < SCHEDULE[0].s;
    el("eyebrow").textContent = before ? "Before School" : "Passing";
    periodEl.textContent = before ? "Good Morning" : "Passing Time";
    el("range").textContent = "";
    el("left").innerHTML = `${next.name} in <b>${mins(next.s - min)}</b>`;
    el("next").textContent = "Starts at " + clock(next.s);
  }

  render();
  setInterval(render, 5000);
</script>
</body>
</html>
