<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summit Bell Clock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap">
<style>
  :root {
    --bg: #000000;
    --panel: #18232e;
    --ink: #f4f6f8;
    --muted: #9fb0bf;
    --accent: #f5b400;
    --line: #2a3945;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Barlow", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  #app {
    box-sizing: border-box;
    height: 100%;
    width: 100%;
    display: grid;
    grid-template-columns: auto auto;
    justify-content: start;
    align-items: center;
    gap: 2.5vw;
    padding: 3vh 2vw;
  }
  .eyebrow {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 500;
    font-size: min(13vh, 4vw);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    line-height: 1;
  }
  .period {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: min(58vh, 13vw);
    line-height: 0.95;
    margin-top: 1vh;
    white-space: nowrap;
    letter-spacing: -0.01em;
  }
  .period.small { font-size: min(34vh, 9vw); line-height: 1.05; }
  .period .team { color: var(--muted); font-weight: 500; font-size: 0.55em; margin-right: 0.25em; }
  .side {
    text-align: left;
    font-variant-numeric: tabular-nums;
    border-left: 2px solid var(--line);
    padding-left: 2.5vw;
    overflow: hidden;
  }
  .range {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 500;
    font-size: min(22vh, 5.6vw);
    line-height: 1;
    white-space: nowrap;
  }
  .left {
    font-size: min(16vh, 4.2vw);
    font-weight: 600;
    line-height: 1.2;
    margin-top: 1.5vh;
    white-space: nowrap;
  }
  .left b { color: var(--accent); }
  .next {
    color: var(--muted);
    font-size: min(13vh, 3vw);
    line-height: 1.2;
    margin-top: 1vh;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div id="app">
  <div>
    <div class="eyebrow" id="eyebrow">Now</div>
    <div class="period" id="period">Loading</div>
  </div>
  <div class="side">
    <div class="range" id="range"></div>
    <div class="left" id="left"></div>
    <div class="next" id="next"></div>
  </div>
</div>

<script>
  // Summit School bell schedules (2026-27). Times are minutes after midnight, America/New_York.
  // tag  = shown in the small yellow eyebrow above the block name
  // short = used in the "Next:" line when the name needs a qualifier
  const T = (h, m) => h * 60 + m;
  const LR = [["9/10", "Lunch"], ["11/12", "Recess"]];
  const RL = [["9/10", "Recess"], ["11/12", "Lunch"]];

  const SCHEDULES = {
    regular: { label: "Regular Day", blocks: [
      { s: T(8,35),  e: T(8,47),  name: "Homeroom" },
      { s: T(8,50),  e: T(9,37),  name: "Period 1" },
      { s: T(9,40),  e: T(10,27), name: "Period 2" },
      { s: T(10,30), e: T(11,17), name: "Period 3" },
      { s: T(11,20), e: T(12,7),  name: "Period 4" },
      { s: T(12,10), e: T(12,12), name: "Homeroom", tag: "Pre-Lunch" },
      { s: T(12,12), e: T(12,42), name: "Lunch / Recess", split: LR },
      { s: T(12,42), e: T(13,12), name: "Recess / Lunch", split: RL },
      { s: T(13,12), e: T(13,14), name: "Homeroom", tag: "Post-Lunch" },
      { s: T(13,17), e: T(14,4),  name: "Period 6" },
      { s: T(14,7),  e: T(14,54), name: "Period 7" },
      { s: T(14,57), e: T(15,0),  name: "Homeroom", tag: "End of Day" },
    ]},
    am: { label: "AM Extended Homeroom", blocks: [
      { s: T(8,35),  e: T(9,30),  name: "Homeroom", tag: "Extended Morning", short: "Ext. Homeroom" },
      { s: T(9,32),  e: T(10,13), name: "Period 1" },
      { s: T(10,15), e: T(10,56), name: "Period 2" },
      { s: T(10,58), e: T(11,39), name: "Period 3" },
      { s: T(11,41), e: T(12,22), name: "Period 4" },
      { s: T(12,25), e: T(12,27), name: "Homeroom", tag: "Pre-Lunch" },
      { s: T(12,27), e: T(12,57), name: "Lunch / Recess", split: LR },
      { s: T(12,57), e: T(13,27), name: "Recess / Lunch", split: RL },
      { s: T(13,27), e: T(13,29), name: "Homeroom", tag: "Post-Lunch" },
      { s: T(13,31), e: T(14,12), name: "Period 6" },
      { s: T(14,14), e: T(14,55), name: "Period 7" },
      { s: T(14,57), e: T(15,0),  name: "Homeroom", tag: "End of Day" },
    ]},
    pm: { label: "PM Extended Homeroom", blocks: [
      { s: T(8,35),  e: T(8,43),  name: "Homeroom", tag: "Morning" },
      { s: T(8,45),  e: T(9,26),  name: "Period 1" },
      { s: T(9,28),  e: T(10,9),  name: "Period 2" },
      { s: T(10,11), e: T(10,52), name: "Period 3" },
      { s: T(10,54), e: T(11,35), name: "Period 4" },
      { s: T(11,38), e: T(11,40), name: "Homeroom", tag: "Pre-Lunch" },
      { s: T(11,40), e: T(12,10), name: "Lunch / Recess", split: LR },
      { s: T(12,10), e: T(12,40), name: "Recess / Lunch", split: RL },
      { s: T(12,40), e: T(12,42), name: "Homeroom", tag: "Post-Lunch" },
      { s: T(12,44), e: T(13,25), name: "Period 6" },
      { s: T(13,27), e: T(14,8),  name: "Period 7" },
      { s: T(14,10), e: T(15,0),  name: "Homeroom", tag: "Student Support Meeting", short: "Ext. Homeroom" },
    ]},
  };

  // Which schedule runs today:
  //   1. ?schedule=am|pm|regular in the URL wins (handy for testing or a second ScreenCloud link)
  //   2. otherwise overrides.json in this repo: { "2026-09-24": "am", "2026-10-02": "pm" }
  //   3. otherwise regular
  const urlPick = new URLSearchParams(location.search).get("schedule");
  let overrides = {};
  async function loadOverrides() {
    try {
      const r = await fetch("overrides.json", { cache: "no-store" });
      if (r.ok) overrides = await r.json();
    } catch (e) {}
  }
  function todaysSchedule(dateKey) {
    const key = (urlPick && SCHEDULES[urlPick]) ? urlPick : (overrides[dateKey] || "regular");
    return SCHEDULES[SCHEDULES[key] ? key : "regular"];
  }

  const fmt = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York", hour: "numeric", minute: "2-digit",
    weekday: "short", hour12: false, year: "numeric", month: "2-digit", day: "2-digit"
  });

  function nyNow() {
    const parts = Object.fromEntries(fmt.formatToParts(new Date()).map(p => [p.type, p.value]));
    const h = parseInt(parts.hour, 10) % 24;
    return { min: h * 60 + parseInt(parts.minute, 10), weekday: parts.weekday,
             dateKey: `${parts.year}-${parts.month}-${parts.day}` };
  }

  function clock(m) {
    const h24 = Math.floor(m / 60), mm = m % 60;
    const h = h24 % 12 || 12;
    const ap = h24 < 12 ? "AM" : "PM";
    return h + ":" + String(mm).padStart(2, "0") + " " + ap;
  }

  function mins(n) { return n + (n === 1 ? " min" : " min"); }

  function render() {
    const { min, weekday, dateKey } = nyNow();
    const SCHEDULE = todaysSchedule(dateKey).blocks;
    const el = id => document.getElementById(id);
    const periodEl = el("period");
    periodEl.classList.remove("small");

    if (weekday === "Sat" || weekday === "Sun") {
      el("eyebrow").textContent = weekday === "Sat" ? "Saturday" : "Sunday";
      periodEl.textContent = "No School";
      el("range").textContent = ""; el("left").textContent = ""; el("next").textContent = "";
      return;
    }

    const cur = SCHEDULE.find(p => min >= p.s && min < p.e);
    const next = SCHEDULE.find(p => p.s > min);

    if (cur) {
      el("eyebrow").textContent = cur.tag || "Now";
      if (cur.split) {
        periodEl.classList.add("small");
        periodEl.innerHTML = cur.split.map(([team, what]) =>
          `<div><span class="team">${team}</span>${what}</div>`).join("");
      } else {
        periodEl.textContent = cur.name;
      }
      el("range").textContent = clock(cur.s) + " – " + clock(cur.e);
      const rem = cur.e - min;
      el("left").innerHTML = `Ends in <b>${mins(rem)}</b>`;
      el("next").textContent = next ? "Next: " + (next.short || next.name) + " " + clock(next.s) : "Last block of the day";
      return;
    }

    if (!next) {
      el("eyebrow").textContent = "School day over";
      periodEl.textContent = "Dismissal";
      el("range").textContent = ""; el("left").textContent = ""; el("next").textContent = "See you tomorrow";
      return;
    }

    const before = min < SCHEDULE[0].s;
    el("eyebrow").textContent = before ? "Before School" : "Passing";
    periodEl.textContent = before ? "Welcome" : "Passing";
    el("range").textContent = "";
    el("left").innerHTML = `${next.short || next.name} in <b>${mins(next.s - min)}</b>`;
    el("next").textContent = "Starts at " + clock(next.s);
  }

  render();
  loadOverrides().then(render);
  setInterval(render, 5000);
  setInterval(loadOverrides, 5 * 60 * 1000);
</script>
</body>
</html>
